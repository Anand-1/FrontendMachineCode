<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container-body">
        <header>
            <h1>Traffic Light</h1>
            <hr>
        </header>
        <section class="action-section">
            <div class="traffic-container" aria-label="Traffic light">
                <div class="circle red active"></div>
                <div class="circle yellow"></div>
                <div class="circle green"></div>
            </div>
            <div class="character">
                <img class="tom active" src="images/tom_waiting.gif" alt="Tom waiting at the traffic light">
                <img class="tom" src="images/tom_standing.gif" alt="Tom waiting at the traffic light">
                <img class="tom" src="images/tom_walking.gif" alt="Tom waiting at the traffic light">
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
